name: Android GKI Kernel Build

on:
  push:
    branches: [ "android13-5.15-2025-03" ]
  pull_request:
    branches: [ "android13-5.15-2025-03" ]

env:
  CLANG_VERSION: clang-r450784d
  CROSS_COMPILE: aarch64-linux-android-
  CLANG_TRIPLE: aarch64-linux-gnu-
  ARCH: arm64
  KERNEL_DIR: .
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          flex \
          bison \
          libssl-dev \
          libelf-dev \
          python3 \
          python3-pip \
          git \
          bc \
          rsync

    - name: Setup Clang
      run: |
        mkdir -p ${{ runner.temp }}/clang
        curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/$CLANG_VERSION.tar.gz | tar -xz -C ${{ runner.temp }}/clang

    - name: Setup Cross Compiler
      run: |
        mkdir -p ${{ runner.temp }}/gcc
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 ${{ runner.temp }}/gcc

    - name: Set environment variables
      run: |
        echo "CLANG_PATH=${{ runner.temp }}/clang/bin" >> $GITHUB_ENV
        echo "CROSS_COMPILE_PATH=${{ runner.temp }}/gcc/bin" >> $GITHUB_ENV
        echo "PATH=${{ runner.temp }}/clang/bin:${{ runner.temp }}/gcc/bin:$PATH" >> $GITHUB_ENV

    - name: Build configuration
      run: |
        make -C $KERNEL_DIR O=out \
          ARCH=$ARCH \
          CC=clang \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          gki_defconfig

    - name: Build kernel
      run: |
        make -C $KERNEL_DIR O=out \
          ARCH=$ARCH \
          CC=clang \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          -j$(nproc)

    - name: Archive artifacts
      uses: actions/upload-artifact@v3
      with:
        name: kernel-build-artifacts
        path: |
          $KERNEL_DIR/out/arch/arm64/boot/Image.gz
          $KERNEL_DIR/out/arch/arm64/boot/dtbo.img
          $KERNEL_DIR/out/arch/arm64/boot/dts/**/*.dtb
