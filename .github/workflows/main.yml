name: Android GKI Kernel CI

on:
  workflow_dispatch:
  push:
    branches: [ "android13-5.15-2025-03" ]
  pull_request:
    branches: [ "android13-5.15-2025-03" ]

env:
  CLANG_VERSION: clang-r450784d
  CROSS_COMPILE: aarch64-linux-android-
  CLANG_TRIPLE: aarch64-linux-gnu-
  ARCH: arm64
  KERNEL_DIR: .
  BUILD_DIR: out

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Cache setup
      uses: actions/cache@v3
      with:
        path: |
          ~/.ccache
          ${{ env.KERNEL_DIR }}/${{ env.BUILD_DIR }}
        key: ${{ runner.os }}-kernel-${{ hashFiles('**/defconfig') }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libssl-dev libelf-dev \
          flex bison bc rsync kmod cpio \
          python3 python3-pip git

    - name: Toolchain setup
      run: |
        mkdir -p ${{ runner.temp }}/clang
        curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/$CLANG_VERSION.tar.gz | tar -xz -C ${{ runner.temp }}/clang

        mkdir -p ${{ runner.temp }}/gcc
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 ${{ runner.temp }}/gcc

    - name: Build environment
      shell: bash
      run: |
        echo "CLANG_PATH=${{ runner.temp }}/clang/bin" >> $GITHUB_ENV
        echo "CROSS_COMPILE_PATH=${{ runner.temp }}/gcc/bin" >> $GITHUB_ENV
        echo "PATH=${{ runner.temp }}/clang/bin:${{ runner.temp }}/gcc/bin:$PATH" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    - name: Kernel config
      run: |
        make -C $KERNEL_DIR O=$BUILD_DIR \
          ARCH=$ARCH \
          CC="clang" \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          LLVM=1 \
          gki_defconfig

    - name: Build kernel
      run: |
        make -C $KERNEL_DIR O=$BUILD_DIR \
          ARCH=$ARCH \
          CC="clang" \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          LLVM=1 \
          -j$(($(nproc) + 1))

    - name: Verify artifacts
      run: |
        file $BUILD_DIR/arch/arm64/boot/Image.gz
        ls -lh $BUILD_DIR/arch/arm64/boot/dtbo.img
        find $BUILD_DIR/arch/arm64/boot/dts -name "*.dtb" | xargs ls -lh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ github.sha }}
        path: |
          ${{ env.BUILD_DIR }}/arch/arm64/boot/Image.gz
          ${{ env.BUILD_DIR }}/arch/arm64/boot/dtbo.img
          ${{ env.BUILD_DIR }}/arch/arm64/boot/dts/**/*.dtb
        retention-days: 3
