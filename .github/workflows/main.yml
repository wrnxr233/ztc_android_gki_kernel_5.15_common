# 工作流程名称
name: Build Android GKI Kernel

# 定义触发工作流程的事件
on:
  push:
    branches:
      - android13-5.15-2025-03 # 当代码推送到此分支时触发
  workflow_dispatch: # 允许在 GitHub Actions 页面手动触发

# 定义作业
jobs:
  build:
    # 作业运行在最新的 Ubuntu 环境
    runs-on: ubuntu-latest

    # 作业步骤
    steps:
    - name: Checkout kernel source
      # 使用 actions/checkout@v3 拉取仓库代码
      uses: actions/checkout@v3
      with:
        # 指定要拉取的仓库和分支
        repository: hfdem/android_gki_kernel_5.15_common # 您的仓库名称
        ref: android13-5.15-2025-03 # 要编译的分支
        fetch-depth: 0 # 获取完整的提交历史，如果需要

    - name: Set up build environment
      # 安装编译所需的依赖包
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3-repo build-essential libncurses-dev bc ccache kmod cpio flex bison openssl libssl-dev dwarves libelf-dev

    - name: Sync AOSP build tools and manifests
      # 同步 AOSP 构建工具和 manifest 文件
      run: |
        # 创建目录用于存放 AOSP 组件
        mkdir aosp
        cd aosp

        # 初始化 repo 客户端并同步 manifest
        # 这里的 manifest URL 和分支可能需要根据您的 Android 版本进行调整
        repo init -u https://android.googlesource.com/platform/manifest -b master
        repo sync -c -j$(nproc) # 同步 manifest，-c 表示只同步当前分支，-j$(nproc) 表示使用所有 CPU 核心加速

        # 同步构建工具、toolchain 等必要的 AOSP 组件
        # 这里的路径是标准的 AOSP 路径，如果您的构建方式不同，请修改
        repo sync -c platform/build platform/build/soong platform/prebuilts/clang/host/linux-x86 platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2-25-4.1.0 platform/prebuilts/misc/linux-x86 platform/prebuilts/build-tools

        cd ..

    - name: Set up toolchain
      # 设置交叉编译工具链的环境变量
      run: |
        # 根据您的 AOSP 同步路径设置 toolchain 路径
        # 这里的路径是示例，请根据实际同步结果调整
        echo "PATH=$GITHUB_WORKSPACE/aosp/prebuilts/clang/host/linux-x86/clang-r416183b/bin:$GITHUB_WORKSPACE/aosp/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2-25-4.1.0/bin:$PATH" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    - name: Configure and build kernel
      # 配置和编译内核
      env:
        # 设置构建相关的环境变量，根据您的内核和目标设备调整
        ARCH: arm64
        SUBARCH: arm64
        # GKI 内核通常使用 build.sh 脚本进行构建
        BUILD_CONFIG: common/build.config.gki.aarch64 # 根据您的内核版本和架构调整构建配置

      run: |
        # 清理之前的构建产物 (如果存在)
        make O=out distclean || true

        # 使用 build.sh 脚本配置和编译内核
        # 请确保您的仓库中有 build/build.sh 脚本
        #BUILD_CONFIG=$BUILD_CONFIG bash ./build/build.sh

        # 如果您的仓库不使用 build.sh，您可能需要手动调用 make 命令
         make -j$(nproc) O=out

    - name: Archive build artifacts
      # 上传编译生成的内核文件作为构建产物
      uses: actions/upload-artifact@v3
      with:
        name: kernel-artifacts
        path: out/dist # 假设构建输出在 out/dist 目录，请根据实际情况调整
        # 如果构建输出在其他位置，请修改 path

